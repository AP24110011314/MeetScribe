[project]
name = "meetscribe-backend"
version = "0.1.0"
description = "MeetScribe API and workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",          # REST API framework
    "uvicorn[standard]>=0.30.0", # ASGI server
    "pydantic>=2.8.0",           # schemas + LLM output validation (AGENTS.md)
    "pydantic-settings>=2.4.0",  # env-based config (AGENTS.md)
    "sqlalchemy[asyncio]>=2.0.30", # ORM (AGENTS.md)
    "asyncpg>=0.29.0",           # async PostgreSQL driver
    "alembic>=1.13.0",           # migrations (AGENTS.md)
    "celery[redis]>=5.4.0",      # background workers (AGENTS.md)
    "redis>=5.0.0",              # Celery broker/result client
    "boto3>=1.34.0",             # S3 presigned URLs (AGENTS.md, Phase 2)
    "passlib[bcrypt]>=1.7.4",    # password hashing (ARCHITECTURE.md)
    "bcrypt>=4.0.0,<4.1",        # passlib bcrypt backend (pinned: passlib needs <4.1)
    "pyjwt>=2.9.0",              # JWT access/refresh tokens (ARCHITECTURE.md)
    "email-validator>=2.2.0",    # pydantic EmailStr validation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",   # TestClient transport
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-passlib>=1.7.7",  # stubs for mypy strict mode
    "aiosqlite>=0.20.0",  # in-memory async DB option for fast tests
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["celery.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
