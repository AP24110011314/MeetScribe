# Render Infrastructure as Code (Blueprint) for MeetScribe
# Deploy all backend services with one click on https://render.com
services:
  # 1. FastAPI REST API Server + Celery Background Worker & Beat (All-in-One Free Tier)
  - type: web
    name: meetscribe-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./scripts/render_build.sh"
    startCommand: "./scripts/render_start.sh"
    healthCheckPath: "/healthz"
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meetscribe-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: meetscribe-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://meetscribe.vercel.app"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        value: ""
      - key: S3_PUBLIC_ENDPOINT_URL
        value: ""
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: TRANSCRIBER
        value: faster_whisper
      - key: WHISPER_MODEL
        value: small
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8

databases:
  # Managed PostgreSQL 16
  - name: meetscribe-db
    databaseName: meetscribe
    user: meetscribe
    region: oregon
    plan: free

  # Managed Redis
  - name: meetscribe-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction

